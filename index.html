<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پروفایل گیمینگ من</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1b162b 0%, #2a2046 50%, #171926 100%);
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 40px 30px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid #c084fc;
      box-shadow: 0 0 20px rgba(192, 132, 252, 0.4);
      margin-bottom: 16px;
      object-fit: cover;
    }

    h1 {
      font-size: 1.6rem;
      color: #f3e8ff;
      margin-bottom: 6px;
    }

    .tagline {
      font-size: 0.95rem;
      color: #d8b4fe;
      margin-bottom: 20px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(192, 132, 252, 0.15);
      color: #e9d5ff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      margin-bottom: 25px;
      border: 1px solid rgba(192, 132, 252, 0.25);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 8px #4ade80;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: block;
      padding: 13px 20px;
      background: rgba(255, 255, 255, 0.04);
      color: #f1f5f9;
      text-decoration: none;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.95rem;
      transition: all 0.25s ease;
    }

    .btn:hover {
      background: rgba(192, 132, 252, 0.2);
      border-color: rgba(192, 132, 252, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(192, 132, 252, 0.2);
    }

    .footer {
      margin-top: 30px;
      font-size: 0.8rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- عکس پروفایل؛ می‌تونی لینک عکست رو اینجا بذاری -->
    <img src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=GamerSoft" alt="Avatar" class="avatar">
    
    <h1>نام گیمری شما (GamerTag)</h1>
    <p class="tagline">عاشق بازی‌های آرامش‌بخش، RPG و ماجراجویی ✨</p>
    
    <div class="status-badge">
      <span class="status-dot"></span>
      در حال بازی: <span>Stardew Valley / Elden Ring</span>
    </div>

    <div class="links">
      <a href="https://discord.gg" target="_blank" class="btn">💬 به دیسکورد من ملحق شو</a>
      <a href="https://steamcommunity.com" target="_blank" class="btn">🎮 پروفایل استیم (Steam)</a>
      <a href="https://twitch.tv" target="_blank" class="btn">🟣 استریم در توییچ</a>
      <a href="https://instagram.com" target="_blank" class="btn">📸 اینستاگرام و ستاپ گیمینگ</a>
    </div>

    <div class="footer">
      ساخته شده با 💜 برای گیمرها
    </div>
  </div>

</body>
</html>
